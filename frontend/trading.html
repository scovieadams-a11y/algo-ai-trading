<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demo Trading - Adams AI Trading</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<nav>

<div class="logo">
Adams AI Trading
</div>


<ul>

<li>
<a href="dashboard.html">Dashboard</a>
</li>

<li>
<a href="chart.html">Charts</a>
</li>

</ul>

</nav>

</header>



<section class="features">


<h2>
Demo Trading Account
</h2>



<div class="card">

<h3>
Balance
</h3>

<p id="balance">
$10,000
</p>

</div>



<div class="card">


<h3>
Open Trade
</h3>


<select id="asset">

<option>XAUUSD</option>

<option>EURUSD</option>

<option>GBPUSD</option>

<option>BTCUSD</option>

</select>


<br><br>


<input 
type="number"
id="amount"
placeholder="Trade Amount">


<br><br>


<button id="buy">
BUY
</button>


<button id="sell">
SELL
</button>


</div>



<div class="card">

<h3>
Trade History
</h3>


<div id="history">

No trades yet

</div>


</div>


</section>



<script src="js/trading.js"></script>


</body>

</html>
